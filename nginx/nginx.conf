# Reverse proxy of the subsystem. It is the ONLY public door of the stack.
#
# Why it exists and we do not hit the gateway directly:
#
#   1. The browser talks only to this origin (:3000). Since the front and the
#      API stay under the same origin, there is no preflight and no CORS
#      anywhere. A badly set CORS is a vulnerability; not having to set it is
#      better than setting it well.
#   2. The gateway stops publishing a port. The front lives in the tpi-front
#      network and the gateway in tpi-edge: no shared network, so from the
#      front there is no route to the gateway, not even by mistake.
#
# What this file does NOT do: authenticate, authorize or touch the X-* headers.
# That is the gateway's job. Here there is only forwarding.

upstream api_gateway {
    server api-gateway:8080;
    keepalive 32;
}

server {
    listen 3000;
    server_name _;

    # An nginx 413 does not have the problem+json format the rest of the
    # system uses. 2 MB is enough for any body of this API.
    client_max_body_size 2m;

    # The gateway already logs one line per request with requestId and
    # traceId. This is the edge one, to tell apart "did not arrive" from
    # "arrived and failed".
    access_log /var/log/nginx/access.log;

    # --- Probe ---------------------------------------------------------------
    # Answers without touching the upstream on purpose: nginx's health is "I
    # can serve", not "the backend is up". If this probed the gateway, a
    # users-service restart would leave nginx unhealthy without anything being
    # broken, and the depends_on of other services would fall in cascade.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- API -----------------------------------------------------------------
    location /api/ {
        proxy_pass http://api_gateway;
        include /etc/nginx/conf.d/proxy-comun.inc;
    }

    # The JWKS does not carry the /api prefix: it is a web convention, not a
    # project one.
    location /.well-known/ {
        proxy_pass http://api_gateway;
        include /etc/nginx/conf.d/proxy-comun.inc;
    }

    # --- Development mailbox --------------------------------------------------
    # ⛔ DEVELOPMENT ONLY. It exposes 2FA codes and activation links of any
    # account, and on top of that lets accounts be activated by publishing the
    # padron event. Delete this location and the service from the compose and
    # it is gone: the front widget only draws itself if this answers.
    #
    # The prefix is /dev/ and not /dev/mailbox: the mailbox also serves
    # /dev/pendientes and /dev/resolver-padron, and with the narrower prefix
    # those two fell into the SPA's `location /` and returned the index.html.
    location /dev/ {
        proxy_pass http://dev-mailbox:4300;
        include /etc/nginx/conf.d/proxy-comun.inc;
    }

    # --- Front ---------------------------------------------------------------
    # Everything that is not API goes to the SPA. Its nginx resolves the
    # client-side routing with try_files, so an /activate?token=... opened
    # directly from the email reaches index.html and the Angular Router takes
    # it.
    #
    # The front and the API share the origin (this :3000) precisely because of
    # this line: it is what makes preflight not exist and no CORS to configure.
    location / {
        proxy_pass http://webapp:4200;
        include /etc/nginx/conf.d/proxy-comun.inc;
    }
}
