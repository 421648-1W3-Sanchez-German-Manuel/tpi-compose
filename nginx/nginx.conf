# Proxy reverso del subsistema. Es la UNICA puerta publica del stack.
#
# Por que existe y no le pegamos al gateway directo:
#
#   1. El navegador habla solo con este origen (:3000). Como el front y la API
#      quedan bajo el mismo origen, no hay preflight y no hace falta CORS en
#      ningun lado. Un CORS mal puesto es una vulnerabilidad; no tenerlo que
#      poner es mejor que ponerlo bien.
#   2. El gateway deja de publicar puerto. El front vive en la red tpi-front y
#      el gateway en tpi-edge: no comparten red, asi que desde el front no hay
#      ruta hacia el gateway ni equivocandose.
#
# Lo que este archivo NO hace: autenticar, autorizar ni tocar los headers X-*.
# Eso es del gateway. Aca solo se reenvia.

upstream api_gateway {
    server api-gateway:8080;
    keepalive 32;
}

server {
    listen 3000;
    server_name _;

    # Un 413 de nginx no tiene el formato problem+json del resto del sistema.
    # 2 MB alcanza para cualquier body de esta API.
    client_max_body_size 2m;

    # El gateway ya escribe una linea por request con requestId y traceId.
    # Esta es la del borde, para poder distinguir "no llego" de "llego y fallo".
    access_log /var/log/nginx/access.log;

    # --- Sonda ---------------------------------------------------------------
    # Contesta sin tocar el upstream a proposito: la salud de nginx es "puedo
    # atender", no "el backend esta arriba". Si esto probara el gateway, un
    # reinicio de users-service dejaria a nginx unhealthy sin tener nada roto,
    # y el depends_on de otros servicios se caeria en cadena.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- API -----------------------------------------------------------------
    location /api/ {
        proxy_pass http://api_gateway;
        include /etc/nginx/conf.d/proxy-comun.inc;
    }

    # El JWKS no lleva el prefijo /api: es una convencion web, no del proyecto.
    location /.well-known/ {
        proxy_pass http://api_gateway;
        include /etc/nginx/conf.d/proxy-comun.inc;
    }

    # --- Front ---------------------------------------------------------------
    # Todo lo que no sea API va a la SPA. Su nginx resuelve el routing del lado
    # del cliente con try_files, asi que un /activate?token=... abierto directo
    # desde el mail llega a index.html y lo toma el Router de Angular.
    #
    # El front y la API comparten origen (este :3000) justamente por esta linea:
    # es lo que hace que no exista preflight y que no haya CORS que configurar.
    location / {
        proxy_pass http://webapp:4200;
        include /etc/nginx/conf.d/proxy-comun.inc;
    }
}
