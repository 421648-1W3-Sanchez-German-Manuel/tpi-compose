# Plataforma Gamificada TUP · Tema 01 — stack NORMAL (tpi-compose-normal)
#
# Es el MISMO stack que docker-compose.yml, con estos cambios minimos:
#   1. `name: tpi-compose-normal` + `container_name: *-normal` + redes
#      `tpi-normal-*`: no choca con el stack dev aunque compartan host.
#      Se corre UNO A LA VEZ (mismos puertos 3000/8761/9090/3001).
#   2. echo-service SIN `build:`: usa la imagen publicada de GHCR con
#      `pull_policy: always`, siempre la mas actualizada, nunca la local.
#   3. La red de plataforma es PROPIA (sin `name:` fijo): no se comparte
#      DNS con el stack dev (mysql/kafka/eureka resolverian al otro).
#
#   docker compose -f docker-compose.normal.yml up -d
#   docker compose -f docker-compose.normal.yml logs -f api-gateway
#   docker compose -f docker-compose.normal.yml down          (agrega -v para borrar tambien los datos)
#
# ---------------------------------------------------------------------------
# TOPOLOGIA DE REDES — igual que el compose dev, con otro prefijo
# ---------------------------------------------------------------------------
#
#   navegador ──► nginx :3000 ──► api-gateway ──► users / echo / los que vengan
#                 [tpi-normal-edge]      [tpi-normal-platform]
#
#   tpi-normal-front     nginx + el front. Sin ruta al gateway ni a los micros.
#   tpi-normal-edge      nginx + api-gateway. Dos miembros y punto.
#   tpi-normal-platform  gateway + eureka + kafka + los micros.
#   tpi-normal-data      mysql + redis. Fuera de la red compartida a proposito.
#
name: tpi-compose-normal

services:

  # ---------------------------------------------------------------------------
  # Borde
  # ---------------------------------------------------------------------------

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-normal
    ports: ["3000:3000"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy-comun.inc:/etc/nginx/conf.d/proxy-comun.inc:ro
    healthcheck:
      # 127.0.0.1 y NO localhost: nginx escucha en 0.0.0.0:3000 (solo IPv4) y
      # dentro del contenedor localhost resuelve tambien a ::1, que es lo que
      # el wget de busybox intenta primero.
      test: ["CMD-SHELL","wget -qO- --timeout=3 http://127.0.0.1:3000/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      api-gateway: {condition: service_healthy}
      webapp: {condition: service_healthy}
    networks: [tpi-normal-edge, tpi-normal-front]
    deploy:
      resources:
        limits:
          memory: 64M

  webapp:
    build:
      context: ../frontend-users
      dockerfile: Dockerfile
    container_name: webapp-normal
    # SIN ports: se llega por el 3000 del proxy, como todo lo demas.
    expose: ["4200"]
    healthcheck:
      test: ["CMD-SHELL","wget -qO- --timeout=3 http://127.0.0.1:4200/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [tpi-normal-front]
    deploy:
      resources:
        limits:
          memory: 64M

  # Buzon de desarrollo: muestra los codigos de 2FA y los enlaces de activacion
  # y de reset que quedan en outbox_events, porque no hay servidor de mail.
  #
  # ⛔ SOLO DESARROLLO. Lista tokens de activacion de CUALQUIER cuenta.
  dev-mailbox:
    image: ghcr.io/412061-ibazeta/dev-mailbox:latest
    build:
      context: ./dev-mailbox
      dockerfile: Dockerfile
    container_name: dev-mailbox-normal
    expose: ["4300"]
    environment:
      DB_HOST: mysql
      DB_NAME: users
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      KAFKA_BROKERS: kafka:9092
      TOPIC_COURSE_VALIDATION: ${TOPIC_COURSE_VALIDATION:-course-events}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      mysql: {condition: service_healthy}
      kafka: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL","wget -qO- --timeout=3 http://127.0.0.1:4300/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [tpi-normal-front, tpi-normal-data, tpi-normal-platform]
    deploy:
      resources:
        limits:
          memory: 128M

  # ---------------------------------------------------------------------------
  # Infraestructura
  # ---------------------------------------------------------------------------

  eureka:
    image: steeltoeoss/eureka-server:latest
    container_name: eureka-normal
    ports: ["8761:8761"]
    healthcheck:
      test: ["CMD-SHELL","wget -qO- --timeout=3 http://localhost:8761/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [tpi-normal-platform]
    deploy:
      resources:
        limits:
          memory: 384M

  mysql:
    image: mysql:8.4                          # DEC-20 · LTS
    container_name: mysql-normal
    environment:
      MYSQL_DATABASE: users
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?falta MYSQL_ROOT_PASSWORD en .env}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --default-time-zone=+00:00
    expose: ["3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-uroot","-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [tpi-normal-data]
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: redis-normal
    # Persistencia: session:{userId} no tiene TTL, Redis aca es el registro de
    # sesiones y no un cache. Sin AOF, un reinicio desloguea a todo el mundo.
    command: ["redis-server","--appendonly","yes"]
    expose: ["6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [tpi-normal-data]
    deploy:
      resources:
        limits:
          memory: 256M

  kafka:
    image: apache/kafka:3.8.0                 # KRaft, sin Zookeeper
    container_name: kafka-normal
    environment:
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Un solo broker: todo replication factor 1 o los topics internos no arrancan.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: tpi-tema-01-cluster
    expose: ["9092"]
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL","/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks: [tpi-normal-platform]
    deploy:
      resources:
        limits:
          memory: 1G

  # ---------------------------------------------------------------------------
  # Microservicios
  # ---------------------------------------------------------------------------

  users-service:
    build:
      context: ../users
      dockerfile: ../tpi-compose/users.Dockerfile
    container_name: users-service-normal
    labels:
      prometheus.scrape: "true"
      prometheus.port: "8083"
      prometheus.path: "/actuator/prometheus"
    # SIN "ports:" A PROPOSITO (U11 / manifiesto §06, DEC-08).
    expose: ["8082","8083"]                   # DEC-28
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/users?connectionTimeZone=UTC&preserveInstants=true"
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_SERVERS: kafka:9092
      EUREKA_URL: http://eureka:8761/eureka/
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt-private.pem   # DEC-18
      JWT_PUBLIC_KEYS_DIR: /run/secrets/jwks
      JWT_ACTIVE_KID: ${JWT_ACTIVE_KID:-dev}
      USERS_FRONT_URL: ${USERS_FRONT_URL:-http://localhost:3000}
      # false ACA A PROPOSITO: este compose no termina TLS en ningun lado
      # (nginx escucha :3000 en HTTP plano). Con Secure=true el navegador
      # nunca manda las cookies de sesion y nadie puede loguearse.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@frc.utn.edu.ar}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      # DEC-34 · el nombre del topico de Cursos lo define su dueño. Estandar de
      # plataforma: topico por dominio (contrato Kafka del equipo de
      # notificaciones). Lo viejo tema-02-cursos.validacion-resuelta.v1 quedo fuera.
      TOPIC_COURSE_EVENTS: ${TOPIC_COURSE_VALIDATION:-course-events}
    volumes:
      - ./secrets:/run/secrets:ro             # gitignoreado. NUNCA en el repo
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      eureka: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://localhost:8083/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [tpi-normal-platform, tpi-normal-data]
    deploy:
      resources:
        limits:
          memory: 768M

  api-gateway:
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway-normal
    labels:
      prometheus.scrape: "true"
      prometheus.port: "8081"
      prometheus.path: "/actuator/prometheus"
    # YA NO PUBLICA PUERTO. La puerta es nginx:3000.
    expose: ["8080","8081"]                   # 8081 = management, red interna
    environment:
      JWKS_URI: http://users-service:8082/.well-known/jwks.json
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      EUREKA_URL: http://eureka:8761/eureka/
      # AQUI SE DA DE ALTA A UN EQUIPO NUEVO. Separado por comas, sin espacios.
      GATEWAY_ALLOWLIST: ${GATEWAY_ALLOWLIST:-users-service,echo-service}
      # DEC-42 · concurrencia maxima POR DESTINO (BulkheadFilter).
      BULKHEAD_ENABLED: ${BULKHEAD_ENABLED:-true}
      BULKHEAD_MAX_CONCURRENT: ${BULKHEAD_MAX_CONCURRENT:-64}
    depends_on:
      users-service: {condition: service_healthy}
      redis: {condition: service_healthy}
      eureka: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://localhost:8081/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
    networks: [tpi-normal-edge, tpi-normal-platform, tpi-normal-data]
    deploy:
      resources:
        limits:
          memory: 768M

  # Servicio de prueba del subsistema. Igual que cualquier otro micro: no
  # valida el JWT, confia en los headers X-* y no publica su puerto.
  #
  # En ESTE compose va SIN build: corre la imagen publicada de GHCR, siempre
  # la mas actualizada (pull_policy: always). Nada de fuente local.
  echo-service:
    image: ghcr.io/412061-ibazeta/echo-service:latest
    pull_policy: always
    container_name: echo-service-normal
    expose: ["8084","8085"]
    environment:
      GATEWAY_URL: http://api-gateway:8080
      EUREKA_URL: http://eureka:8761/eureka/
      ECHO_CLIENT_ID: ${ECHO_CLIENT_ID:-echo-service}
      ECHO_CLIENT_SECRET: ${ECHO_CLIENT_SECRET:-}
    depends_on:
      eureka: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://localhost:8085/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks: [tpi-normal-platform]
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Observabilidad
  # ---------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-normal
    user: root
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports: ["9090:9090"]
    networks: [tpi-normal-platform]
    deploy:
      resources:
        limits:
          memory: 256M

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-normal
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports: ["3001:3000"]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks: [tpi-normal-platform]
    deploy:
      resources:
        limits:
          memory: 256M

# ---------------------------------------------------------------------------
# Redes — propias de este proyecto (NO se comparten con el stack dev)
# ---------------------------------------------------------------------------
networks:
  tpi-normal-front:
    driver: bridge

  tpi-normal-edge:
    driver: bridge

  # A proposito SIN `name:` fijo: queda tpi-compose-normal_tpi-normal-platform
  # y no pisa la tpi-platform del stack dev.
  tpi-normal-platform:
    driver: bridge

  tpi-normal-data:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  kafka-data:
  grafana-data:
