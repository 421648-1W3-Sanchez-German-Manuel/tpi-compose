# Plataforma Gamificada TUP · Tema 01 — stack local
#
# Materializa DEC-40 (SPEC-api-gateway.md §16.2). El nombre del proyecto es
# `tpi-compose` para que se distinga del resto en Docker Desktop.
#
#   docker compose up -d --build
#   docker compose logs -f api-gateway
#   docker compose down          (agrega -v para borrar tambien los datos)
#
# ---------------------------------------------------------------------------
# TOPOLOGIA DE REDES — lo primero que hay que entender de este archivo
# ---------------------------------------------------------------------------
#
#   navegador ──► nginx :3000 ──► api-gateway ──► users / echo / los que vengan
#                 [tpi-edge]      [tpi-platform]
#
#   tpi-front     nginx + el front. El front NO comparte red con el gateway,
#                 asi que no hay forma de pegarle directo ni por error.
#   tpi-edge      nginx + api-gateway. Nada mas entra aca.
#   tpi-platform  gateway + eureka + kafka + los micros. ES LA RED COMPARTIDA:
#                 los otros equipos se enganchan a esta y a ninguna otra.
#   tpi-data      mysql + redis + quien tenga derecho a leerlos. Fuera de la
#                 red compartida a proposito: un micro de otro equipo se
#                 registra en Eureka, no le hablan a nuestra base.
#
# El UNICO puerto publicado del stack es el 3000 de nginx (mas el 8761 de
# Eureka, que es el registro y tiene que ser alcanzable — ver ahi).
name: tpi-compose

services:

  # ---------------------------------------------------------------------------
  # Borde
  # ---------------------------------------------------------------------------

  # La puerta. Ver nginx/nginx.conf para el por que; en dos lineas: el navegador
  # habla con un solo origen, asi no hay preflight y no hace falta CORS en
  # ningun lado, y el gateway deja de publicar puerto.
  nginx:
    image: nginx:1.27-alpine
    container_name: tpi-nginx
    ports: ["3000:3000"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy-comun.inc:/etc/nginx/conf.d/proxy-comun.inc:ro
    healthcheck:
      # 127.0.0.1 y NO localhost: nginx escucha en 0.0.0.0:3000 (solo IPv4) y
      # dentro del contenedor localhost resuelve tambien a ::1, que es lo que
      # el wget de busybox intenta primero. Con `localhost` la sonda da
      # "connection refused" y el contenedor queda unhealthy sirviendo perfecto.
      test: ["CMD-SHELL","wget -qO- --timeout=3 http://127.0.0.1:3000/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      api-gateway: {condition: service_healthy}
      webapp: {condition: service_healthy}
    networks: [tpi-edge, tpi-front]
    deploy:
      resources:
        limits:
          memory: 64M

  # La SPA de Angular, servida como estaticos por su propio nginx.
  #
  # Vive SOLO en tpi-front. No tiene membresia en tpi-edge ni en tpi-platform,
  # asi que desde este contenedor no hay ruta al gateway ni a los micros: todo
  # lo que el navegador pide a /api lo reenvia el proxy del borde. Esa es la
  # mitad estructural de "el front no le pega directo al gateway"; la otra
  # mitad es que el navegador solo conoce el :3000.
  webapp:
    build:
      context: ../frontend-users
      dockerfile: Dockerfile
    container_name: tpi-webapp
    # SIN ports: se llega por el 3000 del proxy, como todo lo demas.
    expose: ["4200"]
    healthcheck:
      # 127.0.0.1 y no localhost: nginx escucha solo en IPv4 y el wget de
      # busybox intenta ::1 primero (ver la sonda del proxy, mismo caso).
      test: ["CMD-SHELL","wget -qO- --timeout=3 http://127.0.0.1:4200/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [tpi-front]
    deploy:
      resources:
        limits:
          memory: 64M

  # Buzon de desarrollo: muestra los codigos de 2FA y los enlaces de activacion
  # y de reset que quedan en outbox_events, porque no hay servidor de mail.
  #
  # ⛔ SOLO DESARROLLO. Lista tokens de activacion de CUALQUIER cuenta, o sea
  # que publicarlo es regalar todas las cuentas. Esta como servicio aparte y no
  # como endpoint de users-service a proposito: asi este codigo no existe dentro
  # de ninguna imagen desplegable, y apagarlo es borrar este bloque — no hay que
  # acordarse de ninguna variable de entorno.
  #
  # Redes: tpi-front (lo consume el navegador via nginx), tpi-data (lee MySQL)
  # y tpi-platform (publica en Kafka el evento de padron resuelto, haciendose
  # pasar por Cursos). Esa ultima es la que lo habilita a destrabar una cuenta
  # en PENDING_COURSE, que es asincronica y no tiene endpoint HTTP que la
  # dispare.
  dev-mailbox:
    # Dev: se construye local pero taguea el nombre de GHCR, asi el build y la
    # imagen publicada son la misma cosa (ver README "republicar").
    image: ghcr.io/412061-ibazeta/dev-mailbox:latest
    build:
      context: ./dev-mailbox
      dockerfile: Dockerfile
    container_name: tpi-dev-mailbox
    expose: ["4300"]
    environment:
      DB_HOST: mysql
      DB_NAME: users
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      KAFKA_BROKERS: kafka:9092
      TOPIC_COURSE_VALIDATION: ${TOPIC_COURSE_VALIDATION:-tema-02-cursos.validacion-resuelta.v1}
      # De donde lee la pestana Logs: la traza que deja el Gateway en Redis.
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      mysql: {condition: service_healthy}
      kafka: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL","wget -qO- --timeout=3 http://127.0.0.1:4300/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [tpi-front, tpi-data, tpi-platform]
    deploy:
      resources:
        limits:
          memory: 128M

  # ---------------------------------------------------------------------------
  # Infraestructura
  # ---------------------------------------------------------------------------

  # El registro. Imagen de terceros, provisoria hasta que exista el servidor
  # propio; ahi esto pasa a ser `build: ../eureka-server`.
  #
  # Publica 8761 A PROPOSITO, y es la unica excepcion a "un solo puerto":
  # un equipo que corre su micro desde el IDE necesita una direccion a la cual
  # registrarse. Publicar el registro no expone nada — Eureka solo dice quien
  # esta vivo, y estar registrado NO alcanza para que el gateway te rutee
  # (hace falta la allowlist, ver GATEWAY_ALLOWLIST mas abajo).
  eureka:
    image: steeltoeoss/eureka-server:latest
    container_name: tpi-eureka
    ports: ["8761:8761"]
    healthcheck:
      # La imagen trae wget y sh, no curl ni bash.
      test: ["CMD-SHELL","wget -qO- --timeout=3 http://localhost:8761/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [tpi-platform]
    deploy:
      resources:
        limits:
          memory: 384M

  mysql:
    image: mysql:8.4                          # DEC-20 · LTS
    container_name: tpi-mysql
    environment:
      MYSQL_DATABASE: users
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?falta MYSQL_ROOT_PASSWORD en .env}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --default-time-zone=+00:00
    expose: ["3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-uroot","-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [tpi-data]
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: tpi-redis
    # Persistencia: session:{userId} no tiene TTL, Redis aca es el registro de
    # sesiones y no un cache. Sin AOF, un reinicio desloguea a todo el mundo.
    command: ["redis-server","--appendonly","yes"]
    expose: ["6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [tpi-data]
    deploy:
      resources:
        limits:
          memory: 256M

  # Kafka no es del Tema 01: el broker es infra compartida de la plataforma y
  # los topics son un contrato con el equipo que los posee (AGENTS.md). Este es
  # un broker local de desarrollo. Ojo con auto-create al enchufar el real.
  # Va en tpi-platform porque los otros equipos tambien publican y consumen.
  kafka:
    image: apache/kafka:3.8.0                 # KRaft, sin Zookeeper
    container_name: tpi-kafka
    environment:
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Un solo broker: todo replication factor 1 o los topics internos no arrancan.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: tpi-tema-01-cluster
    expose: ["9092"]
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL","/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks: [tpi-platform]
    deploy:
      resources:
        limits:
          memory: 1G

  # ---------------------------------------------------------------------------
  # Microservicios
  # ---------------------------------------------------------------------------

  users-service:
    build:
      context: ../users
      dockerfile: ../tpi-compose/users.Dockerfile
    container_name: tpi-users-service
    # SIN "ports:" A PROPOSITO (U11 / manifiesto §06, DEC-08).
    # Es lo que hace confiables los headers X-*: nadie puede saltearse el
    # Gateway. Con 8082 publicado, un DELETE /api/users/{id} con
    # "X-User-Roles: ADMIN" inventado entra sin password, sin token y sin 2FA.
    expose: ["8082","8083"]                   # DEC-28
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/users?connectionTimeZone=UTC&preserveInstants=true"
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_SERVERS: kafka:9092
      EUREKA_URL: http://eureka:8761/eureka/
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt-private.pem   # DEC-18
      JWT_PUBLIC_KEYS_DIR: /run/secrets/jwks
      JWT_ACTIVE_KID: ${JWT_ACTIVE_KID:-dev}
      USERS_FRONT_URL: ${USERS_FRONT_URL:-http://localhost:3000}
      # false ACA A PROPOSITO: este compose no termina TLS en ningun lado
      # (nginx escucha :3000 en HTTP plano). Con Secure=true el navegador
      # nunca manda las cookies de sesion y nadie puede loguearse. El
      # default de la app (application.yml) sigue en true — cualquier
      # despliegue con TLS real no toca esta variable.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@frc.utn.edu.ar}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
    volumes:
      - ./secrets:/run/secrets:ro             # gitignoreado. NUNCA en el repo
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      eureka: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://localhost:8083/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [tpi-platform, tpi-data]
    deploy:
      resources:
        limits:
          memory: 768M

  api-gateway:
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
    container_name: tpi-api-gateway
    # YA NO PUBLICA PUERTO. La puerta es nginx:3000. El gateway vive en
    # tpi-edge, donde el unico que lo alcanza es nginx.
    expose: ["8080","8081"]                   # 8081 = management, red interna
    environment:
      JWKS_URI: http://users-service:8082/.well-known/jwks.json
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      EUREKA_URL: http://eureka:8761/eureka/
      # AQUI SE DA DE ALTA A UN EQUIPO NUEVO. Separado por comas, sin espacios.
      # Reemplaza entera la lista del application.yml. Registrarse en Eureka no
      # alcanza: fuera de esta lista, /api/{loquesea}/** devuelve 404.
      # Despues de tocarla: docker compose up -d api-gateway
      GATEWAY_ALLOWLIST: ${GATEWAY_ALLOWLIST:-users-service,echo-service}
      # DEC-42 · concurrencia maxima POR DESTINO (BulkheadFilter). Bajarlo a 1
      # es la forma de comprobar que el bulkhead esta vivo: con carga paralela
      # tienen que aparecer 503 y lineas BULKHEAD_LLENO en el log.
      BULKHEAD_ENABLED: ${BULKHEAD_ENABLED:-true}
      BULKHEAD_MAX_CONCURRENT: ${BULKHEAD_MAX_CONCURRENT:-64}
    depends_on:
      users-service: {condition: service_healthy}
      redis: {condition: service_healthy}
      eureka: {condition: service_healthy}
    # El unico servicio publico era el unico sin sonda. Va contra el management
    # port, que SecurityConfig deja en permitAll solo para /actuator/health/**.
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://localhost:8081/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
    networks: [tpi-edge, tpi-platform, tpi-data]
    deploy:
      resources:
        limits:
          memory: 768M

  # Servicio de prueba del subsistema. Se comporta igual que cualquier otro
  # micro: no valida el JWT, confia en los headers X-* y no publica su puerto.
  # Da el SEGUNDO destino real, sin el cual no se puede demostrar que la
  # identidad llega a un micro que no es users, ni que el `aud` de un token de
  # servicio acota el alcance a un unico destino.
  #
  # Es tambien el ejemplo vivo de lo que tiene que hacer un equipo nuevo:
  # mismas redes, mismo expose sin ports, misma registracion en Eureka.
  echo-service:
    # Dev: se construye desde el repo hermano pero taguea el nombre de GHCR,
    # para no correr un binario viejo y mantener la imagen al dia con el build.
    image: ghcr.io/412061-ibazeta/echo-service:latest
    build:
      context: ../echo-service
      dockerfile: Dockerfile
    container_name: tpi-echo-service
    expose: ["8084","8085"]
    environment:
      GATEWAY_URL: http://api-gateway:8080
      EUREKA_URL: http://eureka:8761/eureka/
      ECHO_CLIENT_ID: ${ECHO_CLIENT_ID:-echo-service}
      ECHO_CLIENT_SECRET: ${ECHO_CLIENT_SECRET:-}
    depends_on:
      eureka: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://localhost:8085/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks: [tpi-platform]
    deploy:
      resources:
        limits:
          memory: 512M

# ---------------------------------------------------------------------------
# Redes
# ---------------------------------------------------------------------------
networks:
  # Front <-> nginx. El dia que exista el repo del front, su contenedor va SOLO
  # aca: sin membresia en tpi-edge no tiene ruta hacia el gateway.
  tpi-front:
    driver: bridge

  # nginx <-> gateway. Dos miembros y punto.
  tpi-edge:
    driver: bridge

  # LA RED COMPARTIDA de la plataforma. `name` fijo (sin el prefijo del
  # proyecto) para que el compose de otro equipo la pueda referenciar tal cual:
  #
  #     networks:
  #       tpi-platform:
  #         external: true
  #
  # La crea este compose, asi que nuestro stack tiene que estar arriba primero
  # — cosa que igual hace falta, porque ahi viven Eureka y el gateway.
  tpi-platform:
    name: tpi-platform
    driver: bridge

  # MySQL y Redis. Deliberadamente fuera de la red compartida: un equipo que se
  # suma se registra en Eureka y habla por el gateway, no le pega a nuestra base.
  tpi-data:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  kafka-data:
