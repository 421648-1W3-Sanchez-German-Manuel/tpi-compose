# TUP Gamified Platform · Theme 01 — local stack
#
# Implements DEC-40 (SPEC-api-gateway.md §16.2). The project name is
# `tpi-compose` so it stands out from the rest in Docker Desktop.
#
#   docker compose up -d --build
#   docker compose logs -f api-gateway
#   docker compose down          (add -v to also delete the data)
#
# ---------------------------------------------------------------------------
# NETWORK TOPOLOGY — the first thing to understand about this file
# ---------------------------------------------------------------------------
#
#   browser ──► nginx :3000 ──► api-gateway ──► users / echo / whatever comes
#                 [tpi-edge]      [tpi-platform]
#
#   tpi-front     nginx + the front. The front does NOT share a network with
#                 the gateway, so there is no way to hit it directly, not
#                 even by mistake.
#   tpi-edge      nginx + api-gateway. Nothing else gets in here.
#   tpi-platform  gateway + eureka + kafka + the micros. THIS IS THE SHARED
#                 NETWORK: the other teams hook into this one and none other.
#   tpi-data      mysql + redis + whoever has the right to read them. Outside
#                 the shared network on purpose: a micro from another team
#                 registers in Eureka, it does not talk to our database.
#
# The ONLY published port of the stack is nginx's 3000 (plus Eureka's 8761,
# which is the registry and has to be reachable — see there).
name: tpi-compose

services:

  # ---------------------------------------------------------------------------
  # Edge
  # ---------------------------------------------------------------------------

  # The door. See nginx/nginx.conf for the why; in two lines: the browser
  # talks to a single origin, so there is no preflight and no CORS anywhere,
  # and the gateway stops publishing a port.
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports: ["3000:3000"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy-comun.inc:/etc/nginx/conf.d/proxy-comun.inc:ro
    healthcheck:
      # 127.0.0.1 and NOT localhost: nginx listens on 0.0.0.0:3000 (IPv4 only)
      # and inside the container localhost also resolves to ::1, which is what
      # busybox's wget tries first. With `localhost` the probe gets
      # "connection refused" and the container stays unhealthy while serving
      # perfectly fine.
      test: ["CMD-SHELL","wget -qO- --timeout=3 http://127.0.0.1:3000/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      api-gateway: {condition: service_healthy}
      webapp: {condition: service_healthy}
    networks: [tpi-edge, tpi-front]
    deploy:
      resources:
        limits:
          memory: 64M

  # The Angular SPA, served as static files by its own nginx.
  #
  # Lives ONLY in tpi-front. It has no membership in tpi-edge or tpi-platform,
  # so from this container there is no route to the gateway or the micros:
  # everything the browser asks of /api is forwarded by the edge proxy. That
  # is the structural half of "the front does not hit the gateway directly";
  # the other half is that the browser only knows :3000.
  webapp:
    build:
      context: ../frontend-users
      dockerfile: Dockerfile
    container_name: webapp
    # NO ports: it is reached through the proxy's :3000, like everything else.
    expose: ["4200"]
    healthcheck:
      # 127.0.0.1 and not localhost: nginx listens on IPv4 only and busybox's
      # wget tries ::1 first (see the proxy probe, same case).
      test: ["CMD-SHELL","wget -qO- --timeout=3 http://127.0.0.1:4200/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [tpi-front]
    deploy:
      resources:
        limits:
          memory: 64M

  # Development mailbox: shows the 2FA codes and the activation and reset
  # links that remain in outbox_events, because there is no mail server.
  #
  # ⛔ DEVELOPMENT ONLY. It lists activation tokens of ANY account, which
  # means publishing it gives away every account. It sits as a separate
  # service and not as an endpoint of users-service on purpose: this way this
  # code does not exist inside any deployable image, and turning it off is
  # deleting this block — no environment variable to remember.
  #
  # Networks: tpi-front (the browser consumes it via nginx), tpi-data (reads
  # MySQL) and tpi-platform (publishes the resolved-padron event to Kafka,
  # posing as Courses). That last one is what lets it unblock an account in
  # PENDING_COURSE, which is asynchronous and has no HTTP endpoint that
  # triggers it.
  dev-mailbox:
    # Dev: built locally but tagged with the GHCR name, so the build and the
    # published image are the same thing (see README: republish).
    image: ghcr.io/412061-ibazeta/dev-mailbox:latest
    build:
      context: ./dev-mailbox
      dockerfile: Dockerfile
    container_name: dev-mailbox
    expose: ["4300"]
    environment:
      DB_HOST: mysql
      DB_NAME: users
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      KAFKA_BROKERS: kafka:9092
      TOPIC_COURSE_VALIDATION: ${TOPIC_COURSE_VALIDATION:-course-events}
      # Where the Logs tab reads from: the trace the Gateway leaves in Redis.
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      mysql: {condition: service_healthy}
      kafka: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL","wget -qO- --timeout=3 http://127.0.0.1:4300/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [tpi-front, tpi-data, tpi-platform]
    deploy:
      resources:
        limits:
          memory: 128M

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------

  # The registry. Third-party image, provisional until the own server exists;
  # then this becomes `build: ../eureka-server`.
  #
  # Publishes 8761 ON PURPOSE, and it is the only exception to "a single
  # port": a team running its micro from the IDE needs an address to register
  # against. Publishing the registry exposes nothing — Eureka only says who
  # is alive, and being registered is NOT enough for the gateway to route you
  # (the allowlist is required, see GATEWAY_ALLOWLIST below).
  eureka:
    image: steeltoeoss/eureka-server:latest
    container_name: eureka
    ports: ["8761:8761"]
    healthcheck:
      # The image ships wget and sh, not curl or bash.
      test: ["CMD-SHELL","wget -qO- --timeout=3 http://localhost:8761/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [tpi-platform]
    deploy:
      resources:
        limits:
          memory: 384M

  mysql:
    image: mysql:8.4                          # DEC-20 · LTS
    container_name: mysql
    environment:
      MYSQL_DATABASE: users
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?missing MYSQL_ROOT_PASSWORD in .env}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --default-time-zone=+00:00
    expose: ["3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-uroot","-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [tpi-data]
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: redis
    # Persistence: session:{userId} has no TTL, here Redis is the session
    # registry and not a cache. Without AOF, a restart logs everyone out.
    command: ["redis-server","--appendonly","yes"]
    expose: ["6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [tpi-data]
    deploy:
      resources:
        limits:
          memory: 256M

  # Kafka is not part of Theme 01: the broker is shared platform
  # infrastructure and the topics are a contract with the team that owns them
  # (AGENTS.md). This is a local dev broker. Beware of auto-create when the
  # real one is plugged in. It lives in tpi-platform because the other teams
  # also publish and consume.
  kafka:
    image: apache/kafka:3.8.0                 # KRaft, no Zookeeper
    container_name: kafka
    environment:
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single broker: everything at replication factor 1 or the internal
      # topics will not start.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: tpi-tema-01-cluster
    expose: ["9092"]
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL","/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks: [tpi-platform]
    deploy:
      resources:
        limits:
          memory: 1G

  # ---------------------------------------------------------------------------
  # Microservices
  # ---------------------------------------------------------------------------

  users-service:
    build:
      context: ../users
      dockerfile: ../tpi-compose/users.Dockerfile
    container_name: users-service
    labels:
      prometheus.scrape: "true"
      prometheus.port: "8083"
      prometheus.path: "/actuator/prometheus"
    # NO "ports:" ON PURPOSE (U11 / manifest §06, DEC-08).
    # It is what makes the X-* headers trustworthy: nobody can bypass the
    # Gateway. With 8082 published, a DELETE /api/users/{id} with an invented
    # "X-User-Roles: ADMIN" gets in without password, token or 2FA.
    expose: ["8082","8083"]                   # DEC-28
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/users?connectionTimeZone=UTC&preserveInstants=true"
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_SERVERS: kafka:9092
      EUREKA_URL: http://eureka:8761/eureka/
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt-private.pem   # DEC-18
      JWT_PUBLIC_KEYS_DIR: /run/secrets/jwks
      JWT_ACTIVE_KID: ${JWT_ACTIVE_KID:-dev}
      USERS_FRONT_URL: ${USERS_FRONT_URL:-http://localhost:3000}
      # false HERE ON PURPOSE: this compose does not terminate TLS anywhere
      # (nginx listens on :3000 in plain HTTP). With Secure=true the browser
      # never sends the session cookies and nobody can log in. The app default
      # (application.yml) stays true — any deployment with real TLS does not
      # touch this variable.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@frc.utn.edu.ar}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
    volumes:
      - ./secrets:/run/secrets:ro             # gitignored. NEVER in the repo
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      eureka: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://localhost:8083/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [tpi-platform, tpi-data]
    deploy:
      resources:
        limits:
          memory: 768M

  api-gateway:
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    labels:
      prometheus.scrape: "true"
      prometheus.port: "8081"
      prometheus.path: "/actuator/prometheus"
    # NO LONGER PUBLISHES A PORT. The door is nginx:3000. The gateway lives in
    # tpi-edge, where the only one that reaches it is nginx.
    expose: ["8080","8081"]                   # 8081 = management, internal network
    environment:
      JWKS_URI: http://users-service:8082/.well-known/jwks.json
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      EUREKA_URL: http://eureka:8761/eureka/
      # A NEW TEAM IS REGISTERED HERE. Comma-separated, no spaces.
      # It replaces the whole application.yml list. Registering in Eureka is
      # not enough: outside this list, /api/{anything}/** returns 404.
      # After touching it: docker compose up -d api-gateway
      GATEWAY_ALLOWLIST: ${GATEWAY_ALLOWLIST:-users-service,echo-service}
      # DEC-42 · max concurrency PER DESTINATION (BulkheadFilter). Lowering it
      # to 1 is the way to check the bulkhead is alive: under parallel load
      # you must get 503s and BULKHEAD_LLENO lines in the log.
      BULKHEAD_ENABLED: ${BULKHEAD_ENABLED:-true}
      BULKHEAD_MAX_CONCURRENT: ${BULKHEAD_MAX_CONCURRENT:-64}
    depends_on:
      users-service: {condition: service_healthy}
      redis: {condition: service_healthy}
      eureka: {condition: service_healthy}
    # The only public service was the only one without a probe. It goes
    # against the management port, which SecurityConfig keeps at permitAll
    # only for /actuator/health/**.
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://localhost:8081/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
    networks: [tpi-edge, tpi-platform, tpi-data]
    deploy:
      resources:
        limits:
          memory: 768M

  # Test service of the subsystem. Behaves like any other micro: it does not
  # validate the JWT, it trusts the X-* headers and it does not publish its
  # port. It provides the SECOND real destination, without which you cannot
  # prove that identity reaches a micro that is not users, nor that the `aud`
  # of a service token limits scope to a single destination.
  #
  # It is also the live example of what a new team must do: same networks,
  # same expose without ports, same Eureka registration.
  echo-service:
    # Dev: built from the sibling repo but tagged with the GHCR name, so as
    # not to run a stale binary and to keep the image up to date with the
    # build.
    image: ghcr.io/412061-ibazeta/echo-service:latest
    container_name: echo-service
    expose: ["8084","8085"]
    environment:
      GATEWAY_URL: http://api-gateway:8080
      EUREKA_URL: http://eureka:8761/eureka/
      ECHO_CLIENT_ID: ${ECHO_CLIENT_ID:-echo-service}
      ECHO_CLIENT_SECRET: ${ECHO_CLIENT_SECRET:-}
    depends_on:
      eureka: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://localhost:8085/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks: [tpi-platform]
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Observability
  # ---------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    user: root
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports: ["9090:9090"]
    networks: [tpi-platform]
    deploy:
      resources:
        limits:
          memory: 256M

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports: ["3001:3000"]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks: [tpi-platform]
    deploy:
      resources:
        limits:
          memory: 256M

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  # Front <-> nginx. The day the front repo exists, its container goes ONLY
  # here: without membership in tpi-edge there is no route to the gateway.
  tpi-front:
    driver: bridge

  # nginx <-> gateway. Two members and that is it.
  tpi-edge:
    driver: bridge

  # THE SHARED NETWORK of the platform. Fixed `name` (without the project
  # prefix) so another team's compose can reference it as-is:
  #
  #     networks:
  #       tpi-platform:
  #         external: true
  #
  # This compose creates it, so our stack has to be up first — which is needed
  # anyway, because Eureka and the gateway live there.
  tpi-platform:
    name: tpi-platform
    driver: bridge

  # MySQL and Redis. Deliberately outside the shared network: a team that
  # joins registers in Eureka and talks through the gateway, it does not hit
  # our database.
  tpi-data:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  kafka-data:
  grafana-data:
